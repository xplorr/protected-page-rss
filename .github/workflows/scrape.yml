name: Scrape Pages Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Verhoogt de maximale totale duur van de job naar 15 minuten

    steps:
      - name: Code uitchecken
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Afhankelijkheden installeren
        run: npm install axios

      - name: Scraper uitvoeren
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          TARGET_URLS_JSON: ${{ secrets.TARGET_URLS_JSON }}
        run: node scraper.js
        
      - name: Commit en push gegenereerde HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add page*.html
          git commit -m "Update scraped HTML pages" || exit 0
          git push
        
