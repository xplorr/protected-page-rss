name: Scrape Pages Daily

on:
  workflow_dispatch:
  # schedule:
  #  - cron: "0 6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Verhoogt de maximale totale duur van de job naar 15 minuten

    steps:
      - name: Code uitchecken
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Afhankelijkheden installeren
        run: npm install axios

      - name: Scraper uitvoeren
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: node scraper.js
